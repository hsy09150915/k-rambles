<style>

  :root {

  .tile { display: block; border-radius: 16px; text-decoration: none; color: inherit; box-shadow: var(--card-shadow); }
  .tile--photo { position: relative; background: var(--paper-raised); border: 1px solid var(--line); overflow: hidden; }

  .tile-photo-frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--paper-raised); }
  .tile-photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }

  .tile--photo { transition: transform 0.15s ease; }
  .tile-photo-badge { position: absolute; top: 10px; right: 10px; background: var(--coral); color: #fff5ee; font-family: "Space Mono", monospace; font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; }

  .tile-like-btn svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 1.9; transition: fill 0.15s ease; }

  .tile-like-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .tile.reveal { opacity: 0; transform: translateY(12px); transition: opacity 0.5s ease, transform 0.5s ease; }

  footer.site { border-top: 1px solid var(--line); padding: 30px 28px 46px; }

  .footer-links a:hover { color: var(--coral-ink); }
</style>

<script>
(function () {
  var KEY = 'krambles-fontsize';
  var STEPS = ['xs', 'sm', 'md', 'lg', 'xl'];
  var root = document.documentElement;
  var ctrl = document.querySelector('.font-size-ctrl');
  if (!ctrl) { return; }
  var decBtn = ctrl.querySelector('[data-action="dec"]');
  var incBtn = ctrl.querySelector('[data-action="inc"]');
  var index = 2;

  function apply(i) {
    var size = STEPS[i];
    if (size === 'md') { root.removeAttribute('data-fs'); }
    else { root.setAttribute('data-fs', size); }
    decBtn.disabled = i === 0;
    incBtn.disabled = i === STEPS.length - 1;
  }

  var saved = 'md';
  try { saved = localStorage.getItem(KEY) || 'md'; } catch (e) {}
  index = STEPS.indexOf(saved);
  if (index === -1) { index = 2; }
  apply(index);

  decBtn.addEventListener('click', function () {
    if (index > 0) {
      index--;
      apply(index);
      try { localStorage.setItem(KEY, STEPS[index]); } catch (e) {}
    }
  });
  incBtn.addEventListener('click', function () {
    if (index < STEPS.length - 1) {
      index++;
      apply(index);
      try { localStorage.setItem(KEY, STEPS[index]); } catch (e) {}
    }
  });
})();
</script>
