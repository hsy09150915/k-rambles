<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long-Stay Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --paper: #ecdfc0;
    --paper-raised: #fbf8ee;
    --ink: #372b10;
    --ink-soft: #6e5c33;
    --coral: #d9532a;
    --coral-ink: #9c3b1c;
    --navy: #1b2a4a;
    --marigold: #c8891f;
    --line: rgba(55, 43, 16, 0.16);
    --line-strong: rgba(55, 43, 16, 0.3);
    --card-shadow: 0 18px 34px -20px rgba(40, 30, 10, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1509; --paper-raised: #2b2211; --ink: #f7f0dd; --ink-soft: #cbb98f;
      --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.26);
      --card-shadow: 0 18px 34px -18px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b1509; --paper-raised: #2b2211; --ink: #f7f0dd; --ink-soft: #cbb98f;
    --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.26);
    --card-shadow: 0 18px 34px -18px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  html { font-size: 100%; }
  html[data-fs="xs"] { font-size: 85%; }
  html[data-fs="sm"] { font-size: 92.5%; }
  html[data-fs="lg"] { font-size: 115%; }
  html[data-fs="xl"] { font-size: 135%; }
  .font-size-ctrl { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 100px; padding: 4px 8px; }
  .fs-labels { display: inline-flex; align-items: baseline; gap: 3px; }
  .fs-label { font-family: "Work Sans", sans-serif; font-weight: 600; color: var(--ink-soft); line-height: 1; user-select: none; }
  .fs-label-sm { font-size: 0.68rem; }
  .fs-label-lg { font-size: 1.15rem; }
  .fs-step { appearance: none; border: none; background: none; cursor: pointer; color: var(--ink-soft); font-family: "Work Sans", sans-serif; font-weight: 700; font-size: 1.35rem; line-height: 1; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
  .fs-step:hover:not(:disabled) { background: var(--line); color: var(--ink); }
  .fs-step:disabled { opacity: 0.32; cursor: default; }
  a { color: inherit; }
  .mono { font-family: "Space Mono", ui-monospace, "SF Mono", monospace; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 28px; }

  header.site { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 28px; max-width: 1040px; margin: 0 auto; }
  .logo { font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif; font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; }
  .logo span { color: var(--coral); }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-soft); font-size: 0.92rem; }
  .back-link:hover { color: var(--ink); }
  .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
  .lang-switch { display: flex; align-items: center; gap: 6px; font-family: "Space Mono", monospace; font-size: 0.76rem; }
  .lang-switch a, .lang-switch span.current { text-decoration: none; padding: 3px 8px; border-radius: 6px; }
  .lang-switch a { color: var(--ink-soft); }
  .lang-switch a:hover { color: var(--ink); }
  .lang-switch span.current { color: var(--ink); font-weight: 700; border: 1px solid var(--line); }

  .hub-hero { max-width: 1040px; margin: 0 auto; padding: 12px 28px 40px; }
  .hub-icon-badge { width: 56px; height: 56px; border-radius: 16px; background: var(--paper-raised); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: var(--card-shadow); }
  .hub-icon-badge svg { width: 30px; height: 30px; stroke: var(--coral-ink, #9c3b1c); fill: none; }
  h1.hub-title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: clamp(2.1rem, 4.6vw, 3.1rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
  p.hub-dek { font-size: 1.08rem; color: var(--ink-soft); max-width: 56ch; margin: 0 0 8px; }
  p.hub-count { font-family: "Space Mono", monospace; font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 26px; }

  .search-wrap { position: relative; max-width: 420px; margin: 0 0 8px; }
  .search-input { width: 100%; box-sizing: border-box; padding: 12px 16px 12px 42px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink); font-family: "Work Sans", sans-serif; font-size: 0.95rem; }
  .search-input:focus { outline: 2px solid var(--coral); outline-offset: 1px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--ink-soft); fill: none; pointer-events: none; }
  .search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow); max-height: 360px; overflow-y: auto; z-index: 10; display: none; }
  .search-results.is-open { display: block; }
  .search-result { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line); }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover, .search-result:focus-visible { background: var(--paper); }
  .search-result-title { font-weight: 600; font-size: 0.92rem; }
  .search-result-meta { font-family: "Space Mono", monospace; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .search-empty { padding: 14px; font-size: 0.85rem; color: var(--ink-soft); }

  .hub-grid { max-width: 1040px; margin: 0 auto; padding: 10px 28px 90px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }

  .tile { display: block; border-radius: 16px; text-decoration: none; color: inherit; box-shadow: var(--card-shadow); }
  .tile--photo { position: relative; background: var(--paper-raised); border: 1px solid var(--line); overflow: hidden; }
  .tile-photo-link { display: flex; flex-direction: column; height: 100%; color: inherit; text-decoration: none; }
  .tile-photo-link:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
  .tile-photo-frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
  .tile-photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
  .tile--photo:hover .tile-photo-frame img { transform: scale(1.05); }
  .tile--photo:hover { transform: translateY(-3px); }
  .tile--photo { transition: transform 0.15s ease; }
  .tile-photo-badge { position: absolute; top: 10px; right: 10px; background: var(--coral); color: #fff5ee; font-family: "Space Mono", monospace; font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .tile-photo-body { padding: 14px 16px 17px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .tile-photo-label { font-family: "Space Mono", monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--coral-ink); }
  .tile-photo-title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 1.02rem; line-height: 1.32; margin: 0; text-wrap: balance; }
  .tile-like-btn { position: absolute; top: 10px; left: 10px; width: 32px; height: 32px; border-radius: 999px; border: none; background: rgba(15,15,15,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 2; }
  .tile-like-btn svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 1.9; transition: fill 0.15s ease; }
  .tile-like-btn.is-liked svg { fill: var(--coral); stroke: var(--coral); }
  .tile-like-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .tile.reveal { opacity: 0; transform: translateY(12px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .tile.reveal.in-view { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .tile.reveal { opacity: 1; transform: none; transition: none; } }

  footer.site { border-top: 1px solid var(--line); padding: 30px 28px 46px; }
  .footer-inner { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
  .footer-inner .mono { font-size: 0.78rem; color: var(--ink-soft); letter-spacing: 0.04em; }
  .footer-links { display: flex; gap: 18px; font-size: 0.86rem; }
  .footer-links a { color: var(--ink-soft); text-decoration: none; }
  .footer-links a:hover { color: var(--coral-ink); }
</style>

<script>
(function () {
  var KEY = 'krambles-fontsize';
  var STEPS = ['xs', 'sm', 'md', 'lg', 'xl'];
  var root = document.documentElement;
  var ctrl = document.querySelector('.font-size-ctrl');
  if (!ctrl) { return; }
  var decBtn = ctrl.querySelector('[data-action="dec"]');
  var incBtn = ctrl.querySelector('[data-action="inc"]');
  var index = 2;

  function apply(i) {
    var size = STEPS[i];
    if (size === 'md') { root.removeAttribute('data-fs'); }
    else { root.setAttribute('data-fs', size); }
    decBtn.disabled = i === 0;
    incBtn.disabled = i === STEPS.length - 1;
  }

  var saved = 'md';
  try { saved = localStorage.getItem(KEY) || 'md'; } catch (e) {}
  index = STEPS.indexOf(saved);
  if (index === -1) { index = 2; }
  apply(index);

  decBtn.addEventListener('click', function () {
    if (index > 0) {
      index--;
      apply(index);
      try { localStorage.setItem(KEY, STEPS[index]); } catch (e) {}
    }
  });
  incBtn.addEventListener('click', function () {
    if (index < STEPS.length - 1) {
      index++;
      apply(index);
      try { localStorage.setItem(KEY, STEPS[index]); } catch (e) {}
    }
  });
})();
</script>
