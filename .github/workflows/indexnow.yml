name: IndexNow (notify Bing of changed pages)
on:
  push:
    branches: [main]
    paths: ['**/*.html', '*.html', 'sitemap.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in sitemap.xml'
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait until the new key file and pages are live
        run: |
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://k-rambles.com/$KEY")
            [ "$code" = "200" ] && break
            sleep 15
          done
          sleep 45
      - name: Send changed URLs
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            python3 tools/indexnow.py --all
          else
            python3 tools/indexnow.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
          fi
